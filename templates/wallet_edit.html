{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Tárca szerkesztése</h2>

<div class="card shadow-sm" style="max-width: 500px;">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Név</label>
                <input type="text" name="name" class="form-control" value="{{ wallet.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Megjegyzés</label>
                <input type="text" name="description" class="form-control" value="{{ wallet.description or '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Induló egyenleg (Ft) <span class="text-muted fw-normal">— opcionális</span></label>
                <input type="number" name="initial_balance" class="form-control" step="1"
                       value="{{ "%.0f"|format(wallet.initial_balance) if wallet.initial_balance else '' }}"
                       placeholder="0">
                <div class="form-text">Ha a tárca már létező pénzösszeggel indul, add meg itt. Ez beleszámít az egyenlegbe, de nem jelenik meg tranzakcióként.</div>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="is_cash" id="is_cash" class="form-check-input"
                       {{ 'checked' if wallet.is_cash }}>
                <label class="form-check-label" for="is_cash">
                    <i class="bi bi-cash-coin"></i> Készpénzes tárca
                    <small class="text-muted d-block fw-normal">Készpénzes fizetésnél az összeg 5 Ft-ra kerekítve rögzítődik</small>
                </label>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i> Mentés</button>
                <a href="/wallets" class="btn btn-outline-secondary">Mégse</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
