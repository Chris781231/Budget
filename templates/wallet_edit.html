{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Tárca szerkesztése</h2>

<div class="card shadow-sm" style="max-width: 500px;">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Név</label>
                <input type="text" name="name" class="form-control" value="{{ wallet.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Megjegyzés</label>
                <input type="text" name="description" class="form-control" value="{{ wallet.description or '' }}">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i> Mentés</button>
                <a href="/wallets" class="btn btn-outline-secondary">Mégse</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
