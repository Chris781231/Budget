{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-sm-8 col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body text-center p-5">
                <i class="bi bi-shield-lock text-primary" style="font-size:2.8rem;"></i>
                <h4 class="mt-3 mb-1 fw-bold">Kétlépéses hitelesítés</h4>
                <p class="text-muted small mb-4">Add meg a Google Authenticator alkalmazásban látható 6 jegyű kódot.</p>
                {% if error %}
                <div class="alert alert-danger py-2 small">{{ error }}</div>
                {% endif %}
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="text" name="code" class="form-control form-control-lg text-center mb-3"
                           placeholder="000 000" maxlength="7" autocomplete="one-time-code"
                           inputmode="numeric" autofocus>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">
                        <i class="bi bi-check-lg me-1"></i> Megerősítés
                    </button>
                </form>
                <a href="{{ url_for('logout') }}" class="d-block mt-3 small text-muted">
                    <i class="bi bi-box-arrow-right me-1"></i> Kijelentkezés
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
