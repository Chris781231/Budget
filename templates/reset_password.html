{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-sm-8 col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-key text-primary" style="font-size:2.4rem;"></i>
                    <h4 class="mt-2 fw-bold">Új jelszó beállítása</h4>
                    <p class="text-muted small">Add meg az új jelszavadat.</p>
                </div>
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}{% for cat, msg in messages %}
                <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
                {% endfor %}{% endif %}{% endwith %}
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-2">
                        <input type="password" name="password" class="form-control"
                               placeholder="Új jelszó (min. 8 karakter)" required minlength="8" autofocus>
                    </div>
                    <div class="mb-3">
                        <input type="password" name="confirm_password" class="form-control"
                               placeholder="Jelszó megerősítése" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">
                        <i class="bi bi-check-lg me-1"></i> Jelszó mentése
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
