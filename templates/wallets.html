{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Tárcák</h2>

<div class="card shadow-sm mb-4">
    <div class="card-header"><i class="bi bi-plus-circle"></i> Új tárca hozzáadása</div>
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Név</label>
                    <input type="text" name="name" class="form-control" required placeholder="Pl. Revolut">
                </div>
                <div class="col-md-5">
                    <label class="form-label">Megjegyzés</label>
                    <input type="text" name="description" class="form-control" placeholder="Opcionális">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus"></i> Hozzáadás</button>
                </div>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-header"><i class="bi bi-wallet2"></i> Tárcák</div>
    <div class="card-body p-0">
        <table class="table table-striped mb-0">
            <thead>
                <tr>
                    <th>Név</th>
                    <th>Megjegyzés</th>
                    <th class="text-end">Egyenleg</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for w in wallets %}
                <tr>
                    <td class="fw-bold">{{ w.name }}</td>
                    <td class="text-muted">{{ w.description or '-' }}</td>
                    <td class="text-end fw-bold {{ 'text-success' if w.balance >= 0 else 'text-danger' }}">
                        {{ "%.0f"|format(w.balance) }} Ft
                    </td>
                    <td class="text-end">
                        <a href="/wallets/edit/{{ w.id }}" class="btn btn-sm btn-outline-secondary me-1">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a href="/wallets/delete/{{ w.id }}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Biztosan törlöd ezt a tárcát?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="text-center text-muted py-3">Még nincsenek tárcák</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
